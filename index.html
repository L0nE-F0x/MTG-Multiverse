<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Aetherfield — every Magic card ever printed, as a galaxy</title>
    <meta name="description" content="Aetherfield: all 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy. Spiral arms are colour identity, distance from the core is release date, and the brightest stars are the cards you know." />
    <meta name="theme-color" content="#05060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aetherfield" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Social preview. %SITE_URL% is substituted at build time by the plugin in
         vite.config.ts, from Netlify's DEPLOY_PRIME_URL / URL. Absolute URLs are
         required here: WhatsApp in particular will not resolve a relative
         og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aetherfield" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Aetherfield" />
    <meta property="og:description" content="Aetherfield: all 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy. Spiral arms are colour identity, distance from the core is release date, and the brightest stars are the cards you know." />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A spiral galaxy made of Magic: The Gathering cards, with five arms coloured white, blue, violet, red and green." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aetherfield" />
    <meta name="twitter:description" content="Aetherfield: all 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <style>
      /* Base shell only. Everything else lives in src/styles/, owned by the UI layer. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; }
      body { font-family: ui-sans-serif, Inter, system-ui, -apple-system, sans-serif; color: #dce6f5; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }

      /* Boot overlay: deliberately dependency-free so it paints before any
         module loads and still works if the UI layer fails to mount. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: radial-gradient(ellipse at 50% 42%, #0b1024 0%, #04050b 68%);
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot-scan {
        position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(
          0deg, rgba(140, 180, 255, 0.03) 0px, rgba(140, 180, 255, 0.03) 1px,
          transparent 1px, transparent 3px
        );
      }
      #boot-mark {
        width: 88px; height: 88px;
        filter: drop-shadow(0 0 16px rgba(94, 231, 255, 0.3));
        animation: boot-spin 80s linear infinite;
      }
      #boot-title {
        font-size: clamp(22px, 4.6vw, 40px); font-weight: 300;
        letter-spacing: 0.34em; text-indent: 0.34em; text-transform: uppercase;
        background: linear-gradient(120deg, #eaf4ff 0%, #5ee7ff 45%, #a56bff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 22px rgba(94, 231, 255, 0.4));
        animation: boot-glow 3.2s ease-in-out infinite;
      }
      #boot-pips { display: flex; gap: 8px; }
      #boot-pips span { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 7px currentColor; }
      #boot-track {
        width: min(340px, 62vw); height: 2px; margin-top: 8px;
        background: rgba(140, 180, 255, 0.14);
        position: relative; overflow: visible; border-radius: 2px;
      }
      #boot-fill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: linear-gradient(90deg, #5ee7ff, #a56bff);
        box-shadow: 0 0 14px #5ee7ff, 0 0 34px rgba(165, 107, 255, 0.6);
        transition: width 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-label {
        font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase;
        color: rgba(174, 199, 235, 0.68); font-variant-numeric: tabular-nums;
      }
      #boot-label.error { color: #ff8f7a; letter-spacing: 0.08em; text-transform: none; max-width: 46ch; text-align: center; line-height: 1.6; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-glow {
        0%, 100% { filter: drop-shadow(0 0 14px rgba(94, 231, 255, 0.28)); }
        50% { filter: drop-shadow(0 0 28px rgba(165, 107, 255, 0.5)); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot-fill { transition: none; }
        #boot-mark, #boot-title { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <div id="boot-scan"></div>
      <svg id="boot-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <radialGradient id="boot-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#ffe9a8"/>
            <stop offset="100%" stop-color="#ff9a4d" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6">
          <path d="M32 26 L35.45 21.98 L41.36 20.02 L48.61 21.22 L55.68 26.1 L60.89 34.53" stroke="#f8f6d8"/>
          <path d="M37.71 30.15 L42.6 32.18 L46.28 37.2 L47.39 44.46 L44.93 52.69 L38.52 60.26" stroke="#7eb6d9"/>
          <path d="M35.53 36.85 L35.1 42.14 L31.47 47.19 L24.9 50.48 L16.32 50.69 L7.14 46.94" stroke="#8a7f78"/>
          <path d="M28.47 36.85 L23.32 38.08 L17.39 36.19 L12.23 30.96 L9.38 22.86 L10.11 12.97" stroke="#e49977"/>
          <path d="M26.29 30.15 L23.53 25.62 L23.5 19.4 L26.88 12.87 L33.7 7.66 L43.33 5.31" stroke="#7ecb9a"/>
        </g>
        <circle cx="32" cy="32" r="11" fill="url(#boot-core)"/>
        <circle cx="32" cy="32" r="2.6" fill="#ffffff"/>
      </svg>
      <div id="boot-title">Aetherfield</div>
      <div id="boot-pips" aria-hidden="true">
        <span style="background:#f8f6d8;color:#f8f6d8"></span>
        <span style="background:#c1d7e9;color:#c1d7e9"></span>
        <span style="background:#bab1ab;color:#bab1ab"></span>
        <span style="background:#e49977;color:#e49977"></span>
        <span style="background:#9bd3ae;color:#9bd3ae"></span>
      </div>
      <div id="boot-track"><div id="boot-fill"></div></div>
      <div id="boot-label">Initialising</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
