<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Magic Card Universe — every Magic card ever printed, as a galaxy</title>
    <meta name="description" content="All 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy. Spiral arms are colour identity, distance from the core is release date, and the brightest stars are the cards you know." />
    <meta name="theme-color" content="#05060d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Social preview. %SITE_URL% is substituted at build time by the plugin in
         vite.config.ts, from Netlify's DEPLOY_PRIME_URL / URL. Absolute URLs are
         required here: WhatsApp in particular will not resolve a relative
         og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Magic Card Universe" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Magic Card Universe" />
    <meta property="og:description" content="All 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy. Spiral arms are colour identity, distance from the core is release date, and the brightest stars are the cards you know." />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A spiral galaxy made of Magic: The Gathering cards, with five arms coloured white, blue, violet, red and green." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magic Card Universe" />
    <meta name="twitter:description" content="All 117,621 Magic: The Gathering cards ever printed, rendered as one explorable 3D galaxy." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <style>
      /* Base shell only. Everything else lives in src/styles/, owned by the UI layer. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden; }
      body { font-family: ui-sans-serif, Inter, system-ui, -apple-system, sans-serif; color: #dce6f5; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }

      /* Boot overlay: deliberately dependency-free so it paints before any
         module loads and still works if the UI layer fails to mount. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: radial-gradient(ellipse at 50% 55%, #0b1024 0%, #04050b 70%);
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot-title {
        font-size: clamp(15px, 2.2vw, 22px); font-weight: 300;
        letter-spacing: 0.44em; text-indent: 0.44em; text-transform: uppercase;
        color: #cfe4ff; text-shadow: 0 0 26px rgba(94, 231, 255, 0.45);
      }
      #boot-track {
        width: min(340px, 62vw); height: 1px; background: rgba(140, 180, 255, 0.16);
        position: relative; overflow: visible;
      }
      #boot-fill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: linear-gradient(90deg, #5ee7ff, #a56bff);
        box-shadow: 0 0 14px #5ee7ff, 0 0 34px rgba(165, 107, 255, 0.6);
        transition: width 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-label {
        font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase;
        color: rgba(174, 199, 235, 0.68); font-variant-numeric: tabular-nums;
      }
      #boot-label.error { color: #ff8f7a; letter-spacing: 0.08em; text-transform: none; max-width: 46ch; text-align: center; line-height: 1.6; }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <div id="boot-title">Magic Card Universe</div>
      <div id="boot-track"><div id="boot-fill"></div></div>
      <div id="boot-label">Initialising</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
