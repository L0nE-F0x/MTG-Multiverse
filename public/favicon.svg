<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#5ee7ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="armB" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a56bff"/>
      <stop offset="100%" stop-color="#a56bff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05060d"/>

  <!-- Two spiral arms. Deliberately heavy strokes: anything finer disappears
       entirely once the browser scales this to a 16px tab icon. -->
  <g fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M32 32 C 30 20, 40 13, 51 18" stroke="url(#armA)"/>
    <path d="M32 32 C 34 44, 24 51, 13 46" stroke="url(#armB)"/>
  </g>

  <circle cx="32" cy="32" r="15" fill="url(#core)"/>
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
</svg>
