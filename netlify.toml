# Netlify deploy config.
#
# The data files are committed (see .gitignore), so the build is just a
# typecheck plus a Vite bundle — no Scryfall fetch at deploy time.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The generated data is content-addressed by nothing, so it must revalidate;
# but it changes only when the pipeline is re-run, so allow a short cache.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

# Hashed bundle filenames change whenever the contents do.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the worker so a new deploy actually takes over.
#
# No `Service-Worker-Allowed` header. The worker sits at the root here, so its
# default scope is already the whole site and the header bought nothing; but
# Filthy Net Deck proxies this origin under `/aetherfield/`, and a header
# passed through that proxy would let a worker registered from that path claim
# the host's entire marketing origin. `main.ts` also asks for the narrow scope
# explicitly — this is the other half of the same guard.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
